<!DOCTYPE html>
<html>
<head>
    <title>YOLO Detection App</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #0f172a;
            color: white;
        }

        h2 {
            color: #38bdf8;
        }

        button {
            padding: 10px 20px;
            background: #38bdf8;
            border: none;
            color: black;
            cursor: pointer;
            margin-top: 10px;
        }

        img {
            margin-top: 20px;
            border-radius: 10px;
        }

        .container {
            display: flex;
            gap: 40px;
        }

        .box {
            flex: 1;
        }

        pre {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            overflow-x: auto;
        }
    </style>
</head>

<body>

    <h1>🚀 YOLOv8 Detection Dashboard</h1>

    <div class="container">

        <!-- IMAGE DETECTION -->
        <div class="box">
            <h2>📸 Upload Image</h2>

            <input type="file" id="fileInput">
            <br>
            <button onclick="detectImage()">Detect</button>

            <h3>🖼️ Output</h3>
            <img id="outputImage" width="400">

            <h3>📊 JSON Result</h3>
            <pre id="jsonOutput"></pre>
        </div>

        <!-- VIDEO STREAM -->
        <div class="box">
            <h2>🎥 Live Video</h2>

            <img src="http://localhost:8000/v1/detect/video" width="500">

            <p>⚡ Real-time detection stream</p>
        </div>

    </div>

    <script>
        async function detectImage() {
            const fileInput = document.getElementById("fileInput");
            const file = fileInput.files[0];

            if (!file) {
                alert("Please select an image");
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            // 🔥 IMAGE ENDPOINT
            const imageResponse = await fetch("http://localhost:8000/v1/detect/image", {
                method: "POST",
                body: formData
            });

            const imageBlob = await imageResponse.blob();
            document.getElementById("outputImage").src =
                URL.createObjectURL(imageBlob);

            // 🔥 JSON ENDPOINT
            const jsonResponse = await fetch("http://localhost:8000/v1/detect", {
                method: "POST",
                body: formData
            });

            const jsonData = await jsonResponse.json();
            document.getElementById("jsonOutput").textContent =
                JSON.stringify(jsonData, null, 2);
        }
    </script>

</body>
</html>
